<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Earth 3D - Mining Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#78bde8}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000;z-index:4}
.top{display:flex;justify-content:space-between;gap:12px;padding:14px}
.currency{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#102019e8;border:2px solid #ffffff38;border-radius:13px;padding:7px 13px;min-width:105px;box-shadow:0 5px 20px #0005}
.small{font-size:10px;color:#d8e3dc;text-transform:uppercase}.big{font-size:19px;font-weight:900}
.quest{width:245px;background:#102019e8;border:2px solid #ffffff38;border-radius:14px;padding:12px}
.bar{height:8px;background:#08100c;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffd34f}
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:end}
.hot{width:62px;height:62px;background:#111b18e8;border:2px solid #ffffff44;border-radius:12px;text-align:center;padding:6px;font-size:12px}.hot.sel{border-color:#ffd34f;box-shadow:0 0 18px #ffd34f66}.hot b{font-size:22px;display:block}
#buttons{position:absolute;right:16px;bottom:18px;width:150px;pointer-events:auto}
button{border:0;border-radius:11px;padding:11px;width:100%;margin-top:7px;font-weight:900;cursor:pointer;box-shadow:0 5px 15px #0004}
.green{background:#55d879;color:#08200e}.purple{background:#a96cff;color:white}.dark{background:#16231e;color:white;border:1px solid #ffffff33}
#hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#102019dd;border:1px solid #ffffff33;border-radius:12px;padding:9px 15px;font-size:13px;white-space:nowrap}
#toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-10px);background:#102019ef;border:2px solid #ffd34f;padding:12px 20px;border-radius:12px;font-weight:900;opacity:0;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:auto}.modal.show{display:flex}.box{width:min(520px,92vw);max-height:80vh;overflow:auto;background:#101a16;border:2px solid #ffffff2b;border-radius:18px;padding:20px;color:white;box-shadow:0 30px 100px #000}
.card{background:#18261fe8;border:1px solid #ffffff22;border-radius:12px;padding:12px;margin:8px 0}.card h3{margin:0 0 4px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{width:auto;padding:8px 12px;margin:0;background:#55d879}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="currency">
      <div class="pill"><div class="small">Cash</div><div class="big" id="cash">$0</div></div>
      <div class="pill"><div class="small">Backpack</div><div class="big" id="bag">0 / 25</div></div>
      <div class="pill"><div class="small">Level</div><div class="big" id="level">1</div></div>
      <div class="pill"><div class="small">Pickaxe</div><div class="big" id="power">1</div></div>
    </div>
    <div class="quest"><b>🎯 ACTIVE QUEST</b><div id="questText">Mine 25 rocks</div><div class="bar"><i id="questBar"></i></div></div>
  </div>
  <div id="hint">WASD / Arrow Keys to move • Mouse drag to rotate • Click a rock to mine</div>
  <div id="bottom">
    <div class="hot sel"><b>⛏️</b>Pickaxe</div>
    <div class="hot"><b>🪨</b>Ore</div><div class="hot"><b>💎</b>Rare</div>
  </div>
  <div id="buttons"><button class="green" id="sell">💰 SELL ORE</button><button class="purple" id="worlds">🌎 WORLDS</button><button class="dark" id="upgrades">⚒ UPGRADES</button></div>
  <div id="toast"></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const SAVE="deep-earth-3d-v2";
const worlds=[
 {name:"Green Meadows",need:0,mult:1,ground:0x62a94d,rock:0x59616a,rare:"Stone",sky:0x8fd0f5},
 {name:"Desert Mines",need:500,mult:2.2,ground:0xc99654,rock:0x806044,rare:"Copper",sky:0xf1bd72},
 {name:"Crystal Caverns",need:3000,mult:5,ground:0x273b53,rock:0x43516b,rare:"Crystal",sky:0x17243b},
 {name:"Volcano Depths",need:15000,mult:10,ground:0x39201b,rock:0x51413e,rare:"Ruby",sky:0x24100d},
 {name:"Frozen Peaks",need:60000,mult:22,ground:0xbfd4df,rock:0x687988,rare:"Voidite",sky:0x8cb5d5}
];
const oreDefs=[
 {name:"Stone",value:1,chance:.70,color:0x8b949e},
 {name:"Copper",value:4,chance:.18,color:0xd8793f},
 {name:"Crystal",value:12,chance:.07,color:0x69d8ff},
 {name:"Ruby",value:35,chance:.04,color:0xff4e59},
 {name:"Voidite",value:100,chance:.01,color:0xb786ff}
];
let state={cash:0,ore:0,capacity:25,power:1,world:0,rocksMined:0,level:1,xp:0,totalCash:0,upgrade:0};
try{state={...state,...JSON.parse(localStorage.getItem(SAVE)||"{}")}}catch{}
const save=()=>localStorage.setItem(SAVE,JSON.stringify(state));
const money=n=>"$"+Math.floor(n).toLocaleString();
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove("show"),1500)};
function update(){
 cash.textContent=money(state.cash);bag.textContent=Math.floor(state.ore)+" / "+state.capacity;power.textContent=state.power;level.textContent=state.level;
 questBar.style.width=Math.min(100,state.rocksMined/25*100)+"%";
 questText.textContent=state.rocksMined>=25?"Quest complete! Claim $500":"Mine "+Math.max(0,25-state.rocksMined)+" more rocks";
}
const scene=new THREE.Scene();scene.background=new THREE.Color(worlds[state.world].sky);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById("game").appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xdff5ff,0x31502b,2.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4dc,3);sun.position.set(-30,45,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

let group=new THREE.Group();scene.add(group),rocks=[],decor=[];
const mat=(c,rough=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
function mesh(geo,c){const m=new THREE.Mesh(geo,mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function add(o){group.add(o);decor.push(o);return o}
function rockMesh(x,z,ore=null){
 const s=.9+Math.random()*1.5, geo=new THREE.DodecahedronGeometry(s,1);
 const r=mesh(geo,worlds[state.world].rock);r.position.set(x,s*.55,z);r.scale.y=.65+Math.random()*.35;
 r.userData.mine=true;r.userData.hp=2+state.world*2;r.userData.ore=ore||pickOre();rocks.push(r);add(r);
 // ore crystals sticking out
 if(r.userData.ore.name!=="Stone"){
  for(let i=0;i<2;i++){let c=mesh(new THREE.OctahedronGeometry(.18+Math.random()*.16),r.userData.ore.color);c.position.set((Math.random()-.5)*s,.2,(Math.random()-.5)*s);c.userData.parentRock=r;r.add(c)}
 }
}
function pickOre(){let r=Math.random(),s=0;for(const o of oreDefs){s+=o.chance;if(r<s)return o}return oreDefs[0]}
function tree(x,z){
 const t=mesh(new THREE.CylinderGeometry(.16,.24,1.8,7),0x765032);t.position.set(x,.9,z);add(t);
 for(let i=0;i<3;i++){const l=mesh(new THREE.ConeGeometry(1.1-i*.2,1.8,7),0x28713a);l.position.set(x,1.7+i*.65,z);add(l)}
}
function build(){
 while(group.children.length)group.remove(group.children[0]);rocks=[];decor=[];
 const w=worlds[state.world];
 const floor=mesh(new THREE.PlaneGeometry(100,100,30,30),w.ground);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;add(floor);
 // decorative paths
 const path=mesh(new THREE.PlaneGeometry(7,75),0xb89461);path.rotation.x=-Math.PI/2;path.position.y=.015;add(path);
 for(let i=0;i<35;i++){let x=(Math.random()-.5)*75,z=(Math.random()-.5)*75;if(Math.abs(x)<5)continue;tree(x,z)}
 for(let i=0;i<38;i++){let x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.abs(x)<8){i--;continue}rockMesh(x,z)}
 // mine entrance
 const cabin=mesh(new THREE.BoxGeometry(6,3.2,5),0x765239);cabin.position.set(-9,1.6,-8);add(cabin);
 const roof=mesh(new THREE.ConeGeometry(4.5,2.6,4),0x3a2920);roof.rotation.y=Math.PI/4;roof.position.set(-9,4.4,-8);add(roof);
 const door=mesh(new THREE.BoxGeometry(1.3,2.2,.2),0x241b16);door.position.set(-9,1.1,-5.45);add(door);
 for(let i=0;i<8;i++){const rail=mesh(new THREE.BoxGeometry(5,.08,.12),0x5d4935);rail.position.set(-9,.12,-3+i*.7);add(rail)}
}
build();

let player=new THREE.Group();scene.add(player);
function buildPlayer(){
 player.clear();
 const body=mesh(new THREE.CapsuleGeometry(.48,1.15,5,10),0x202733);body.position.y=1.25;player.add(body);
 const head=mesh(new THREE.SphereGeometry(.42,12,8),0xb97850);head.position.y=2.25;player.add(head);
 const hair=mesh(new THREE.SphereGeometry(.44,12,6,0,Math.PI*2,0,Math.PI*.48),0x3a2419);hair.position.y=2.45;player.add(hair);
 const leg1=mesh(new THREE.CapsuleGeometry(.16,.7,4,7),0x15191f),leg2=leg1.clone();leg1.position.set(-.22,.42,0);leg2.position.set(.22,.42,0);player.add(leg1,leg2);
 const arm=mesh(new THREE.CapsuleGeometry(.13,.65,4,7),0x202733);arm.position.set(.55,1.35,.05);arm.rotation.z=-.55;player.add(arm);
 const pick=mesh(new THREE.BoxGeometry(.1,1.5,.1),0x8a5b35);pick.position.set(.75,1.55,.05);pick.rotation.z=-.55;player.add(pick);
 const head=mesh(new THREE.BoxGeometry(.72,.12,.12),0xb6b0a8);head.position.set(.48,2.08,.05);head.rotation.z=-.55;player.add(head);
}
buildPlayer();player.position.set(0,0,8);

let yaw=0.35,camDist=9,drag=false,lastX=0;
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{if(drag){yaw-=(e.clientX-lastX)*.008;lastX=e.clientX}});
let keys={};addEventListener("keydown",e=>keys[e.code]=true);addEventListener("keyup",e=>keys[e.code]=false);

const ray=new THREE.Raycaster();
renderer.domElement.addEventListener("click",e=>{
 const rect=renderer.domElement.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*2-1,y=-(e.clientY-rect.top)/rect.height*2+1;
 ray.setFromCamera(new THREE.Vector2(x,y),camera);const hit=ray.intersectObjects(rocks,true)[0];
 if(hit){let r=hit.object;while(r.parent&&!r.userData.mine)r=r.parent;if(r.userData.mine)mine(r)}
});
function mine(r){
 if(state.ore>=state.capacity){toast("🎒 Backpack full — sell your ore!");return}
 r.userData.hp-=state.power;r.rotation.x+=.12;r.rotation.z+=.08;
 if(r.userData.hp<=0){
  const o=r.userData.ore,amount=Math.min(state.capacity-state.ore,1+Math.floor(state.power/2));state.ore+=amount;state.rocksMined++;
  state.xp+=10;if(state.xp>=100){state.xp-=100;state.level++;state.power++;toast("⭐ LEVEL UP! Pickaxe power increased!")}else toast("⛏️ +"+amount+" "+o.name);
  const idx=rocks.indexOf(r);if(idx>=0)rocks.splice(idx,1);group.remove(r);setTimeout(()=>rockMesh((Math.random()-.5)*70,(Math.random()-.5)*70),1800);
 }else toast("⛏️ Hit rock • "+r.userData.hp+" HP left");
 update();save();
}
function sellOre(){if(!state.ore){toast("Mine some ore first!");return}const earned=state.ore*worlds[state.world].mult*(1+state.upgrade*.15);state.cash+=earned;state.totalCash+=earned;state.ore=0;toast("💰 Sold for "+money(earned));update();save()}
sell.onclick=sellOre;

function show(title,body){modal.classList.add("show");modalBox.innerHTML="<h2>"+title+"</h2>"+body+"<button class='dark' id='close'>CLOSE</button>";close.onclick=()=>modal.classList.remove("show")}
worlds.onclick=()=>show("🌎 Worlds",worlds.map((w,i)=>`<div class="card"><div class="row"><div><h3>${w.name}</h3><small>Sell multiplier ×${w.mult}</small></div><button ${state.totalCash<w.need?"disabled":""} data-w="${i}">${i===state.world?"CURRENT":state.totalCash>=w.need?"TRAVEL":"NEED "+money(w.need)}</button></div></div>`).join(""));
modal.addEventListener("click",e=>{if(e.target.dataset.w!==undefined){const i=+e.target.dataset.w;state.world=i;build();scene.background=new THREE.Color(worlds[i].sky);player.position.set(0,0,8);modal.classList.remove("show");toast("🌎 Entered "+worlds[i].name);save();update()}});

upgrades.onclick=()=>{const c=250*Math.pow(1.65,state.power-1);show("⚒ Upgrades",`
<div class="card"><div class="row"><div><h3>⛏ Pickaxe Power</h3><small>More damage per hit • Level ${state.power}</small></div><button id="buy">${money(c)}</button></div></div>
<div class="card"><div class="row"><div><h3>🎒 Backpack</h3><small>+10 storage</small></div><button id="bagUp">${money(state.capacity*5)}</button></div></div>
<div class="card"><div class="row"><div><h3>🔥 Smelter</h3><small>+15% selling value</small></div><button id="smelt">${money(500+state.upgrade*600)}</button></div></div>`);
setTimeout(()=>{
 buy.onclick=()=>{if(state.cash>=c){state.cash-=c;state.power++;toast("⛏️ Pickaxe upgraded!");save();update();upgrades.click()}};
 bagUp.onclick=()=>{let c2=state.capacity*5;if(state.cash>=c2){state.cash-=c2;state.capacity+=10;toast("🎒 Backpack upgraded!");save();update();upgrades.click()}};
 smelt.onclick=()=>{let c3=500+state.upgrade*600;if(state.cash>=c3){state.cash-=c3;state.upgrade++;toast("🔥 Smelter upgraded!");save();update();upgrades.click()}};
},0)};

function animate(t){
 requestAnimationFrame(animate);
 const dt=.016,move=new THREE.Vector3();
 if(keys.KeyW||keys.ArrowUp)move.z-=1;if(keys.KeyS||keys.ArrowDown)move.z+=1;if(keys.KeyA||keys.ArrowLeft)move.x-=1;if(keys.KeyD||keys.ArrowRight)move.x+=1;
 if(move.length()){move.normalize().multiplyScalar(6*dt);move.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.add(move);player.position.x=Math.max(-45,Math.min(45,player.position.x));player.position.z=Math.max(-45,Math.min(45,player.position.z));player.rotation.y=Math.atan2(move.x,move.z)}
 const target=player.position.clone();target.y+=1.2;
 const camOffset=new THREE.Vector3(Math.sin(yaw)*camDist,5.3,Math.cos(yaw)*camDist);camera.position.lerp(target.clone().add(camOffset),.12);camera.lookAt(target);
 renderer.render(scene,camera)
}
update();animate(0);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
