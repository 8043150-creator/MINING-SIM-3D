<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gem Rush 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c7ff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
.panel{background:linear-gradient(180deg,rgba(17,27,30,.94),rgba(8,14,18,.9));border:2px solid #8d9a78;border-radius:13px;box-shadow:0 7px 25px #0007, inset 0 1px #ffffff22}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
.stat{min-width:185px;height:58px;padding:7px 14px;border-radius:16px;border:2px solid #526b55;background:#101820eF;display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px}
.stat small{display:block;font-size:11px;color:#b9c3c7}.icon{font-size:29px}
#left{position:absolute;left:18px;top:85px;width:165px;display:flex;flex-direction:column;gap:9px}
.menuBtn{pointer-events:auto;height:58px;border:2px solid #8f9c7b;border-radius:12px;background:linear-gradient(#293734,#111b1b);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #0008}
.menuBtn:hover{filter:brightness(1.25);transform:translateY(-1px)}
#quest{position:absolute;right:18px;top:18px;width:245px;padding:14px 16px}
#quest h3{margin:0 0 8px;color:#ffe76a}.bar{height:15px;border-radius:10px;background:#20292b;overflow:hidden;border:1px solid #000}.fill{height:100%;background:linear-gradient(90deg,#ffb72b,#ffe36d)}
#level{position:absolute;left:18px;bottom:18px;width:185px;padding:12px}
#hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.slot{width:68px;height:68px;background:#101719dd;border:2px solid #56605d;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-size:31px}
.slot.active{border-color:#ffd34e;box-shadow:0 0 14px #ffd34e66}.slot b{position:absolute;left:6px;top:3px;font-size:12px}.slot span{position:absolute;right:6px;bottom:4px;font-size:13px}
#right{position:absolute;right:18px;bottom:20px;display:flex;flex-direction:column;gap:9px}
.bigBtn{pointer-events:auto;width:175px;height:52px;border:2px solid #92c58e;border-radius:12px;color:#fff;font-size:19px;font-weight:900;cursor:pointer;background:linear-gradient(#31b84c,#14772b);box-shadow:0 5px 15px #0008}
.bigBtn.tp{background:linear-gradient(#a94bff,#6120a2);border-color:#d4a6ff}
#hint{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:#071014aa;font-weight:700;font-size:14px}
#toast{position:absolute;left:50%;top:75px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#10191ddd;border:1px solid #ffffff33;opacity:0;transition:.2s;font-weight:800}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,92vw);max-height:80vh;overflow:auto;padding:18px;pointer-events:auto}
.modal h2{margin:0 0 14px;color:#ffd95b}.close{float:right;background:#a73526;color:white;border:0;border-radius:7px;padding:6px 10px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{padding:12px;background:#182327;border:1px solid #58645f;border-radius:10px}.card h3{margin:0 0 6px}.buy{float:right;background:#2cad42;color:white;border:0;border-radius:7px;padding:8px 11px;font-weight:900;cursor:pointer}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.75}.cross1,.cross2{position:absolute;background:white}.cross1{width:22px;height:2px;top:10px}.cross2{height:22px;width:2px;left:10px}
@media(max-width:800px){#top{gap:4px}.stat{min-width:115px;font-size:16px;height:48px;padding:5px 8px}.icon{font-size:22px}#left{left:8px;top:70px;width:130px}.menuBtn{height:45px;font-size:14px}#quest{right:8px;top:70px;width:190px;font-size:12px}.slot{width:53px;height:53px}.hotbar{bottom:8px}.slot:nth-child(n+6){display:none}.bigBtn{width:130px}.right{right:8px}}
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <div class="stat"><div class="icon">🪙</div><div><span id="cash">12,450</span><small>Cash</small></div></div>
    <div class="stat"><div class="icon">💎</div><div><span id="gems">125</span><small>Gems</small></div></div>
    <div class="stat"><div class="icon">💜</div><div><span id="crystals">0</span><small>Rare Crystals</small></div></div>
  </div>
  <div id="left">
    <button class="menuBtn" data-modal="shop">🧰 Shop</button>
    <button class="menuBtn" data-modal="inventory">🎒 Inventory</button>
    <button class="menuBtn" data-modal="upgrades">⬆️ Upgrades</button>
    <button class="menuBtn" data-modal="quests">📜 Quests</button>
    <button class="menuBtn" data-modal="worlds">🌎 Worlds</button>
  </div>
  <div id="quest" class="panel">
    <h3>⭐ Active Quest</h3><b>Mine 50 Stone</b>
    <div class="bar" style="margin-top:8px"><div id="qfill" class="fill" style="width:46%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:5px"><span id="qcount">23 / 50</span><span>🪙 1,000 &nbsp; 💎 25</span></div>
  </div>
  <div id="level" class="panel"><div style="font-size:20px;font-weight:900">⭐ Level <span id="lvl">5</span></div><div class="bar" style="margin-top:8px"><div id="xpfill" class="fill" style="width:43%"></div></div><div id="xptext" style="font-size:12px;margin-top:4px">280 / 650 XP</div></div>
  <div id="hotbar">
    <div class="slot active"><b>1</b>⛏️</div><div class="slot"><b>2</b>🪨<span id="stone">47</span></div><div class="slot"><b>3</b>🟠<span id="copper">12</span></div><div class="slot"><b>4</b>⚪<span id="iron">6</span></div><div class="slot"><b>5</b>🟡<span id="gold">3</span></div><div class="slot"><b>6</b>💜<span id="amethyst">1</span></div>
  </div>
  <div id="right"><button class="bigBtn" id="sell">💰 SELL ORE</button><button class="bigBtn tp" id="teleport">🌀 TELEPORT</button></div>
  <div id="hint">WASD / Arrow Keys to move • Drag mouse to rotate camera • Click a rock to mine</div>
  <div id="toast"></div><div id="crosshair"><div class="cross1"></div><div class="cross2"></div></div>
  <div id="modalRoot"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9ff);
scene.fog=new THREE.Fog(0x83c9ff,45,180);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9edff,0x6b7c55,2.3));
const sun=new THREE.DirectionalLight(0xfff0c8,3.1); sun.position.set(-40,70,30); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-100; sun.shadow.camera.right=100; sun.shadow.camera.top=100; sun.shadow.camera.bottom=-100; scene.add(sun);

const state={cash:12450,gems:125,crystals:0,level:5,xp:280,stone:47,copper:12,iron:6,gold:3,amethyst:1,power:18,bag:70,speed:1,world:0,quest:23,ore:0};
const worlds=[
 {name:"Green Meadows",need:0,sky:0x83c9ff,ground:0x65a84a,rock:0x59636b,rare:0xf5b51b,mult:1},
 {name:"Desert Mines",need:25000,sky:0xf2b96d,ground:0xc98d43,rock:0x715743,rare:0xff7c1e,mult:2},
 {name:"Crystal Caverns",need:100000,sky:0x18184d,ground:0x20244a,rock:0x3d4562,rare:0x52aaff,mult:4},
 {name:"Volcano Depths",need:400000,sky:0x4c1511,ground:0x402522,rock:0x393036,rare:0xff5428,mult:7},
 {name:"Frozen Peaks",need:1500000,sky:0x8fd8ff,ground:0xafd3df,rock:0x778b9c,rare:0xbaf6ff,mult:12}
];

const keys={}; addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true}); addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

function mat(c,rough=1){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function box(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=m.receiveShadow=true;return m}
function sphere(r,c){let m=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),mat(c));m.castShadow=m.receiveShadow=true;return m}
function cone(r,h,c,n=8){let m=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),mat(c));m.castShadow=m.receiveShadow=true;return m}

const player=new THREE.Group(); scene.add(player);
function buildPlayer(){
  const body=box(1.05,1.35,.65,0x20252b); body.position.y=2.15; player.add(body);
  const head=sphere(.48,0xd79b67); head.position.y=3.25; player.add(head);
  const hair=sphere(.5,0x3a2418); hair.scale.y=.55; hair.position.set(0,3.62,0); player.add(hair);
  for(const x of [-.72,.72]){const arm=box(.34,1.2,.4,0x20252b);arm.position.set(x,2.25,0);arm.rotation.z=x<0?-0.15:0.15;player.add(arm)}
  for(const x of [-.3,.3]){const leg=box(.4,1.25,.45,0x15191e);leg.position.set(x,1.05,0);player.add(leg);const shoe=box(.48,.22,.75,0xeeeeee);shoe.position.set(x,.42,-.08);player.add(shoe)}
  const handle=box(.12,2.1,.12,0x7b4a25);handle.position.set(.82,2.4,-.05);handle.rotation.z=-.62;player.add(handle);
  const pickHead=box(.18,.72,.14,0xb8bec0);pickHead.position.set(.25,3.25,-.05);pickHead.rotation.z=1.15;player.add(pickHead);
}
buildPlayer(); player.position.set(0,0,8);

const terrain=new THREE.Group();
scene.add(terrain);
const rocks=new THREE.Group();
scene.add(rocks);
const deco=new THREE.Group();
scene.add(deco);
let rockList=[], spawnTimer=0;

function makeGround(w){
  while(terrain.children.length)terrain.remove(terrain.children[0]);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(220,220,1,1),mat(w.ground));
  g.rotation.x=-Math.PI/2;g.receiveShadow=true;terrain.add(g);
  // paths
  const path=box(10,.04,220,0x9c754d);path.position.set(0,.03,0);terrain.add(path);
  if(w.name==="Desert Mines") for(let i=0;i<18;i++){let c=cone(1.4,5,0x5c4a35,7);c.position.set((Math.random()-.5)*100,2.5,(Math.random()-.5)*100);deco.add(c)}
  if(w.name==="Frozen Peaks") for(let i=0;i<18;i++){let c=cone(2,7,0xddebf0,7);c.position.set((Math.random()-.5)*100,3.5,(Math.random()-.5)*100);deco.add(c)}
  if(w.name==="Volcano Depths"){for(let i=0;i<12;i++){let c=cone(2,7,0x262226,7);c.position.set((Math.random()-.5)*100,3.5,(Math.random()-.5)*100);deco.add(c)}}
  if(w.name==="Green Meadows") {
    for(let i=0;i<32;i++){
      let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.abs(x)<10)continue;
      const trunk=box(.45,2,.45,0x704728);trunk.position.set(x,1,z);deco.add(trunk);
      const top=cone(1.8,4,0x246b36,8);top.position.set(x,3.4,z);deco.add(top);
      const top2=cone(1.35,3,0x2d7e3d,8);top2.position.set(x,5.1,z);deco.add(top2);
    }
  }
}
function clearGroup(g){while(g.children.length)g.remove(g.children[0])}
function spawnRocks(){
  clearGroup(rocks);rockList=[];
  const w=worlds[state.world];
  for(let i=0;i<34;i++){
    const a=Math.random()*Math.PI*2,r=8+Math.random()*48;
    const group=new THREE.Group(); group.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.6+Math.random()*1.5,1),mat(w.rock));
    rock.scale.y=.75;rock.position.y=1.2;rock.castShadow=rock.receiveShadow=true;group.add(rock);
    const type=Math.random()<.62?"Stone":Math.random()<.45?"Copper Ore":Math.random()<.55?"Iron Ore":Math.random()<.62?"Gold Ore":"Amethyst";
    const colors={"Copper Ore":0xc46a2b,"Iron Ore":0x9ca9b2,"Gold Ore":0xffc21c,"Amethyst":0x9b48ff};
    if(type!=="Stone"){
      for(let k=0;k<3;k++){let crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.28,.1),mat(colors[type]));crystal.position.set((Math.random()-.5)*1.8,1.1+Math.random()*1.2,(Math.random()-.5)*1.8);crystal.scale.y=1.7;crystal.castShadow=true;group.add(crystal)}
    }
    group.userData={type,hp: type==="Stone"?3:4,dead:false};
    rocks.add(group);rockList.push(group);
  }
}
makeGround(worlds[0]);
scene.background.set(worlds[0].sky);
scene.fog.color.set(worlds[0].sky);
spawnRocks();

const portal=box(4,.2,4,0x7a35d9);portal.position.set(0,.12,-28);scene.add(portal);
const sellPad=box(5,.2,5,0x1fae42);sellPad.position.set(0,.13,25);scene.add(sellPad);

let camYaw=.45,camPitch=.42,drag=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{if(!drag)return;camYaw-=(e.clientX-lastX)*.006;camPitch=Math.max(.15,Math.min(1.15,camPitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1500)}
function updateUI(){
  for(const id of ["cash","gems","crystals","stone","copper","iron","gold","amethyst","lvl"])document.getElementById(id).textContent=state[id].toLocaleString();
  document.getElementById("qcount").textContent=state.quest+" / 50";
  document.getElementById("qfill").style.width=Math.min(100,state.quest/50*100)+"%";
  document.getElementById("xptext").textContent=state.xp+" / 650 XP";
  document.getElementById("xpfill").style.width=Math.min(100,state.xp/650*100)+"%";
}
function save(){localStorage.gemRush3D=JSON.stringify(state)}
function load(){try{Object.assign(state,JSON.parse(localStorage.gemRush3D||"{}"))}catch{}updateUI()}load();

let swing=0,lastMine=0;
function mine(group){
  if(group.userData.dead || performance.now()-lastMine<450/state.speed)return;
  lastMine=performance.now(); swing=1;
  group.userData.hp-=state.power/10;
  group.rotation.y+=.15;
  const type=group.userData.type;
  state.ore++;
  if(type==="Stone")state.stone++; else if(type==="Copper Ore")state.copper++; else if(type==="Iron Ore")state.iron++; else if(type==="Gold Ore")state.gold++; else {state.amethyst++;state.crystals++}
  state.quest=Math.min(50,state.quest+1); state.xp+=12;
  toast("⛏️ +1 "+type);
  if(state.xp>=650){state.level++;state.xp-=650;toast("⭐ LEVEL UP!")}
  if(group.userData.hp<=0){group.userData.dead=true;group.visible=false;setTimeout(()=>{group.userData.hp=group.userData.type==="Stone"?3:4;group.userData.dead=false;group.visible=true;group.rotation.y=0},4000)}
  updateUI();save();
}
renderer.domElement.addEventListener("click",e=>{
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(rocks.children.flatMap(g=>g.children),true);
  if(hits.length){let g=hits[0].object;while(g.parent&&g.parent!==rocks)g=g.parent;if(g.parent===rocks)mine(g)}
});

function sell(){
  const vals={stone:1,copper:8,iron:18,gold:50,amethyst:120};
  let amount=state.stone*vals.stone+state.copper*vals.copper+state.iron*vals.iron+state.gold*vals.gold+state.amethyst*vals.amethyst;
  amount=Math.floor(amount*worlds[state.world].mult);
  if(!amount){toast("Nothing to sell!");return}
  state.cash+=amount;state.stone=state.copper=state.iron=state.gold=state.amethyst=0;toast("💰 Sold ore for $"+amount.toLocaleString());updateUI();save()
}
document.getElementById("sell").onclick=sell;
document.getElementById("teleport").onclick=()=>openModal("worlds");

function openModal(kind){
  const root=document.getElementById("modalRoot"),m=document.createElement("div");m.className="panel modal";
  const close=()=>root.innerHTML="";
  let content="";
  if(kind==="worlds") content=`<button class="close">X</button><h2>🌎 Worlds</h2><div class="grid">${worlds.map((w,i)=>`<div class="card"><h3>${i===state.world?"📍 ":""}${w.name}</h3><p>${i===0?"Easy":"Unlock: $"+w.need.toLocaleString()}</p><button class="buy" data-world="${i}">${i===state.world?"Here":state.cash>=w.need?"Teleport":"Locked"}</button></div>`).join("")}</div>`;
  if(kind==="upgrades") content=`<button class="close">X</button><h2>⬆️ Upgrades</h2><div class="grid">
  <div class="card"><h3>⛏️ Pickaxe Power ${state.power}</h3><p>More damage per hit.</p><button class="buy" data-up="power">$${(3200+state.power*250).toLocaleString()}</button></div>
  <div class="card"><h3>🎒 Backpack ${state.bag}</h3><p>More ore capacity.</p><button class="buy" data-up="bag">$${(2000+state.bag*20).toLocaleString()}</button></div>
  <div class="card"><h3>⚡ Mining Speed x${state.speed.toFixed(1)}</h3><p>Mine faster.</p><button class="buy" data-up="speed">$${(1000+Math.round(state.speed*900)).toLocaleString()}</button></div></div>`;
  if(kind==="inventory") content=`<button class="close">X</button><h2>🎒 Inventory</h2><div class="grid">${["stone","copper","iron","gold","amethyst"].map(x=>`<div class="card"><h3>${x}</h3><b>${state[x]} collected</b></div>`).join("")}</div>`;
  if(kind==="shop") content=`<button class="close">X</button><h2>🧰 Shop</h2><div class="grid"><div class="card"><h3>💎 25 Gems</h3><p>Buy gems with in-game cash.</p><button class="buy" data-shop="gems">Buy $2,500</button></div><div class="card"><h3>✨ Rare Booster</h3><p>Not yet unlocked.</p></div></div>`;
  if(kind==="quests") content=`<button class="close">X</button><h2>📜 Quests</h2><div class="card"><h3>Mine 50 Stone</h3><p>${Math.min(state.quest,50)}/50 complete</p><button class="buy" data-claim="quest">${state.quest>=50?"Claim $1,000 + 25 Gems":"Keep Mining"}</button></div>`;
  m.innerHTML=content;root.appendChild(m);m.querySelector(".close").onclick=close;
  m.querySelectorAll("[data-world]").forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(i===state.world)return;if(state.cash<worlds[i].need){toast("🔒 You need $"+worlds[i].need.toLocaleString());return}state.world=i;makeGround(worlds[i]);spawnRocks();scene.background=new THREE.Color(worlds[i].sky);scene.fog.color.set(worlds[i].sky);close();toast("🌎 Teleported to "+worlds[i].name);save()});
  m.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{let u=b.dataset.up,cost=u==="power"?3200+state.power*250:u==="bag"?2000+state.bag*20:1000+Math.round(state.speed*900);if(state.cash<cost){toast("Not enough cash");return}state.cash-=cost;if(u==="power")state.power+=6;if(u==="bag")state.bag+=10;if(u==="speed")state.speed+=.2;updateUI();save();openModal("upgrades")});
  m.querySelector("[data-shop]")?.addEventListener("click",()=>{if(state.cash>=2500){state.cash-=2500;state.gems+=25;updateUI();save();toast("💎 +25 Gems")}});
  m.querySelector("[data-claim]")?.addEventListener("click",()=>{if(state.quest>=50){state.cash+=1000;state.gems+=25;state.quest=0;updateUI();save();toast("🎁 Quest reward claimed!")}});
}
document.querySelectorAll("[data-modal]").forEach(b=>b.onclick=()=>openModal(b.dataset.modal));

function move(dt){
  let x=0,z=0;if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;
  if(x||z){const len=Math.hypot(x,z);x/=len;z/=len;const c=Math.cos(camYaw),s=Math.sin(camYaw);player.position.x+=(x*c+z*s)*dt*9;player.position.z+=(z*c-x*s)*dt*9;player.rotation.y=Math.atan2(x*c+z*s,z*c-x*s);player.position.x=Math.max(-70,Math.min(70,player.position.x));player.position.z=Math.max(-70,Math.min(70,player.position.z))}
}
let clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);move(dt);
  swing=Math.max(0,swing-dt*4);
  const pick=player.children[player.children.length-1]; if(pick){pick.rotation.x=Math.sin(swing*Math.PI)*1.5}
  const target=new THREE.Vector3(player.position.x,2.2,player.position.z);
  const dist=13;const cp=Math.cos(camPitch),sp=Math.sin(camPitch);
  const desired=new THREE.Vector3(player.position.x+Math.sin(camYaw)*dist*cp,player.position.y+4+sp*dist,player.position.z+Math.cos(camYaw)*dist*cp);
  camera.position.lerp(desired,.1);camera.lookAt(target);
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
